; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
; Common settings for all environments
monitor_filters = send_on_enter
monitor_eol = CRLF
monitor_echo = yes
lib_deps =
	paulstoffregen/Encoder@^1.4.4
	fastled/FastLED@^3.9.4

[env:micro]
build_type = release
extra_scripts = pre:set_hwids.py
platform = atmelavr
board = micro
;board_upload.use_1200bps_touch = false
;board_upload.wait_for_upload_port = false
framework = arduino
build_flags =
	-Wl,-Map,${BUILD_DIR}/output.map -Wl,-cref		; create a map file	for size debugging
;	-D SERIAL_BUFFER_SIZE=16						; reduce the serial buffer size to 16 bytes
debug_build_flags =
	-Os	-ggdb3 -g3					; optimize for size and include debug symbols (Default: -Og -g2 -ggdb2)
	-D SIMULATOR_DEBUGGING			; define SIMULATOR_DEBUGGING for the simulator
debug_tool = simavr
lib_ldf_mode = chain

[env:esp32-s3-devkitc-1]
build_type = release
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
board = esp32-s3-devkitc-1
upload_protocol = esptool
upload_speed = 2000000     ;ESP32S3 USB-Serial Converter maximum 2000000bps
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
build_flags =
	-D CORE_DEBUG_LEVEL=5
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-zero]
; In order to use the ESP32-S3-Zero board, you need to install the ESP32-S3 board package in PlatformIO.
; You can do this by adding the file esp32-s3-zero.json to your platformio/boards folders.
; On Windows this is usually located at C:\Users\<username>\.platformio\platforms\espressif32\boards
platform = espressif32
framework = arduino
board = esp32-s3-zero

[platformio]
src_dir = src
default_envs = micro


; Information for esp32-s3-devkitc-1 board
; https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html
;
; The ESP32-S3-DevKitC-1 is used for debugging purposes. The device has an onboard JTAG interface for programming and debugging and has a lot more memory/space available
; for the debug symbols.
; The device has two USB connectors. The right one is used for Serial communication (RX/TX) and the left one is used for JTAG programming/debugging.
; You have to install the drivers (on Windows) for the JTAG interface to work. The left USB connector serves two interface: USB-Serial (interface 0) and JTAG (interface 2).
; Use ZADIG to install the driver for the JTAG interface. The USB-Serial interface is used for uploading the code and debugging. The JTAG interface is used for debugging.
; More information:
; https://community.platformio.org/t/how-to-use-jtag-built-in-debugger-of-the-esp32-s3-in-platformio/36042
;