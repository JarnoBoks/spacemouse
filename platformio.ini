; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
monitor_filters = send_on_enter
monitor_eol = CRLF
monitor_echo = yes
lib_deps =
	paulstoffregen/Encoder@^1.4.4
	fastled/FastLED@^3.9.4

[env:micro]
build_type = release
extra_scripts = pre:set_hwids.py
platform = atmelavr
board = micro
framework = arduino
build_flags =
	-Wl,-Map,${BUILD_DIR}/output.map -Wl,-cref
debug_build_flags =
	-Os	-ggdb3 -g3
	-D SIMULATOR_DEBUGGING
debug_tool = simavr
lib_ldf_mode = chain

[env:esp32-s3-devkitc-1]
platform = https://github.com/platformio/platform-espressif32.git
framework = arduino
board = esp32-s3-devkitc-1
upload_protocol = esptool
upload_speed = 2000000
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
build_flags =
	-D CORE_DEBUG_LEVEL=5
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = adafruit/Adafruit TinyUSB Library@3.3.1

[env:esp32-s3-devkitc-1-ota]
extends = esp32-s3-devkitc-1
upload_protocol = espota
upload_speed = 2000000
upload_port = SpaceMouse-Devkitc-1.local
build_flags =
	-D INI_OTAHOSTNAME=\"SpaceMouse-Devkitc-1\"
framework = arduino
board = esp32-s3-zero
lib_deps = adafruit/Adafruit TinyUSB Library@3.3.1

[env:esp32-s3-zero-ota]
extends = esp32-s3-zero
upload_protocol = espota
upload_speed = 2000000
upload_port = SpaceMouse-S3Zero.local
build_flags =
	-D INI_OTAHOSTNAME=\"SpaceMouse-S3Zero\"
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3_OTA=1
lib_deps = adafruit/Adafruit TinyUSB Library@3.3.1
